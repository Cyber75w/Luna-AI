[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-ai"
version = "0.1.0"
description = "A polished local-first terminal chat app for Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=0.70,<2", "rich>=13.3"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
voice = ["vosk>=0.3.45", "sounddevice>=0.4.6", "pyttsx3>=2.90"]
system = ["psutil>=5.9"]
ocr = ["pypdf>=4.0", "pypdfium2>=4.30", "Pillow>=10", "pytesseract>=0.3.10"]
secure = ["cryptography>=42"]

[project.scripts]
luna = "luna:main"

[tool.setuptools]
py-modules = ["luna"]
